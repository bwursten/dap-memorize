<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DAP Memorize</title>
<style>
:root{
  --bg:#f6f6f2; --surface:#ffffff; --text:#1d1f23; --muted:#6b7078; --line:#e2e2dc;
  --accent:#3b5bdb; --accent-ink:#ffffff; --accent-soft:#e8edff;
  --good:#2b8a3e; --good-bg:#e6f4ea; --bad:#c92a2a; --bad-bg:#fdecec;
  --s0:#868e96; --s1:#3b82f6; --s2:#8b5cf6; --s3:#0d9488; --s4:#e8590c; --s5:#2b8a3e;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.05);
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#14161a; --surface:#1e2127; --text:#eceef1; --muted:#9aa1ab; --line:#30353d;
    --accent:#8aa0ff; --accent-ink:#0e1122; --accent-soft:#252b44;
    --good:#69db7c; --good-bg:#17301f; --bad:#ff8787; --bad-bg:#3a1c1c;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:780px;margin:0 auto;padding:16px 16px 56px}
h1{font-size:1.7rem;line-height:1.2;margin:8px 0 4px}
h2{font-size:1.05rem;margin:28px 0 10px;letter-spacing:.01em}
.sub{color:var(--muted);margin:0 0 16px}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:600;transition:transform .05s,background .15s}
.btn:hover{background:var(--accent-soft)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 12px;font-size:.9rem}
.btn.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.topbar .ttl{font-weight:700;flex:1}
.topbar .meta{color:var(--muted);font-size:.9rem}
.prog{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:18px}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}

/* home */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{text-align:center;padding:12px 8px}
.stat b{display:block;font-size:1.5rem;line-height:1.1}
.stat span{color:var(--muted);font-size:.82rem}
.cta{width:100%;padding:16px;font-size:1.1rem;border-radius:12px}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.mode{text-align:left;cursor:pointer;display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.mode:hover{border-color:var(--accent)}
.mode .mi{font-size:1.6rem;line-height:1}
.mode b{display:block}
.mode small{color:var(--muted);display:block;line-height:1.35}
.plist{display:grid;gap:8px}
.pcard{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px}
.pcard:hover{border-color:var(--accent)}
.pcard .em{font-size:1.5rem}
.pcard .nm{font-weight:700}
.pcard .nm span{color:var(--muted);font-weight:600;margin-right:6px}
.pcard .bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.pcard .bar i{display:block;height:100%}
.pcard .rt{text-align:right;font-size:.8rem;color:var(--muted);white-space:nowrap}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:99px;color:#fff}
.st0{background:var(--s0)}.st1{background:var(--s1)}.st2{background:var(--s2)}.st3{background:var(--s3)}.st4{background:var(--s4)}.st5{background:var(--s5)}
.ladder{display:flex;gap:4px;margin:10px 0 2px}
.ladder span{flex:1;font-size:.7rem;text-align:center;padding:3px 0;border-radius:6px;background:var(--line);color:var(--muted);font-weight:700}
.ladder span.on{color:#fff}
.foot{margin-top:34px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;color:var(--muted);font-size:.85rem}

/* study */
.prompt{font-weight:700;margin:4px 0 10px}
.badge{display:inline-block;font-size:.78rem;font-weight:700;color:#fff;padding:3px 10px;border-radius:99px;margin-bottom:10px}
.pchip{display:inline-flex;align-items:center;gap:8px;background:var(--accent-soft);border-radius:99px;padding:4px 12px;font-weight:700;margin-bottom:6px}
.pchip .em{font-size:1.2rem}
.pchip .num{color:var(--muted)}
.meaning{color:var(--muted);font-size:.9rem;margin:0 0 12px}
.meaning b{color:var(--accent);font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;margin-right:6px}
.teach .t-head{display:flex;gap:14px;align-items:center;margin-bottom:8px}
.big-em{font-size:2.6rem;line-height:1}
.t-num{color:var(--muted);font-size:.85rem;font-weight:600}
.t-kw{font-size:1.4rem;font-weight:800}
.eyebrow{font-size:.72rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin:14px 0 2px}
.t-sum{margin:0;color:var(--muted)}
.t-full{margin:0;font-weight:600;font-size:1.05rem}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.fb{margin-top:14px;padding:10px 14px;border-radius:10px;font-weight:600}
.fb.ok{background:var(--good-bg);color:var(--good)}
.fb.no{background:var(--bad-bg);color:var(--bad)}

/* cloze */
.cloze-text{font-size:1.1rem;line-height:2.5;margin:8px 0}
.blank{white-space:nowrap}
.blank input{border:0;border-bottom:2px solid var(--accent);background:var(--accent-soft);border-radius:6px 6px 0 0;padding:1px 4px;text-align:center;outline:none;font-size:1rem}
.blank input:focus{background:var(--surface);box-shadow:0 0 0 2px var(--accent)}
.blank.ok .ans{color:var(--good);background:var(--good-bg);border-radius:6px;padding:1px 5px;font-weight:700}
.blank.bad .ans{color:var(--bad);background:var(--bad-bg);border-radius:6px;padding:1px 5px;font-weight:700}
.blank .typed{color:var(--muted);margin-right:4px}

/* recall */
textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;resize:vertical;font-size:1.02rem;line-height:1.6}
textarea:focus{outline:2px solid var(--accent)}
.hit{background:var(--good-bg);color:var(--good);border-radius:4px;padding:0 2px}
.miss{background:var(--bad-bg);color:var(--bad);border-radius:4px;padding:0 2px;font-weight:700}
.hintline{font-family:ui-monospace,Menlo,monospace;color:var(--muted);letter-spacing:.04em;margin:8px 0 12px;word-break:break-word;line-height:1.8;font-size:1.02rem}
.cue{background:var(--accent-soft);border-radius:10px;padding:10px 14px;color:var(--text)}
.liveview{min-height:3.2em;line-height:2;margin:0 0 10px;padding:8px 12px;border:1px dashed var(--line);border-radius:10px}
.liveview:empty::before{content:'Your words appear here, green when right and red when off.';color:var(--muted);font-size:.9rem}
.typing{color:var(--muted);border-bottom:2px solid var(--accent)}
.small{font-size:.85rem}

/* pick a word */
.slot{display:inline-block;min-width:4ch;border-bottom:2px dashed var(--line);text-align:center;color:var(--muted);line-height:1.3}
.slot.cur{border-bottom:2px solid var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:800;border-radius:6px 6px 0 0}
.pickopts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.opt{display:flex;align-items:center;gap:8px;justify-content:center;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 10px;font-weight:700;font-size:1.02rem;box-shadow:var(--shadow);word-break:break-word}
.opt:hover{border-color:var(--accent);background:var(--accent-soft)}
.opt .key{font-size:.7rem;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px}
@media (max-width:520px){.pickopts{grid-template-columns:1fr}}

/* scramble */
.answer{min-height:64px;border:2px dashed var(--line);border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;margin-bottom:14px}
.answer:empty::before{content:'Tap phrases below in order…';color:var(--muted);font-size:.9rem;padding:6px}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600;box-shadow:var(--shadow);text-align:left}
.chip:hover{border-color:var(--accent)}
.chip.ok{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.chip.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}

/* forms */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.segb{appearance:none;border:0;background:transparent;padding:8px 12px;cursor:pointer;font-weight:600;font-size:.92rem}
.segb.on{background:var(--accent);color:var(--accent-ink)}
.field{margin:14px 0}
.field label{display:block;font-weight:700;margin-bottom:6px}
select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;min-width:220px;max-width:100%}

@media (max-width:520px){
  .stats{gap:6px}
  .cloze-text{font-size:1.02rem}
  .ladder span{font-size:.62rem}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';

/* ================= CONTENT ================= */
const P = [
  { n:1, e:'🧬', k:'Dynamic',
    s:'Who a child is by nature and the world around them keep shaping each other as the child grows.',
    t:"Development and learning are dynamic processes that reflect the complex interplay between a child's biological characteristics and the environment, each shaping the other as well as future patterns of growth." },
  { n:2, e:'🧩', k:'All domains',
    s:'Body, thinking, feelings, and language all matter, and growth in one helps the others.',
    t:"All domains of child development – physical development, cognitive development, social and emotional development, and linguistic development (including bilingual or multilingual development), as well as approaches to learning – are important; each domain both supports and is supported by the others." },
  { n:3, e:'🎲', k:'Play',
    s:'Play is how children learn happily, and every child needs it from birth to age 8.',
    t:"Play promotes joyful learning that fosters self-regulation, language, cognitive and social competencies as well as content knowledge across disciplines. Play is essential for all children, birth through age 8." },
  { n:4, e:'🌍', k:'Variation',
    s:'Children follow a general pattern of growth, but culture, experiences, and each child\'s own makeup make every child different.',
    t:"Although general progression of development and learning can be identified, variations due to cultural contexts, experiences, and individual differences must also be considered." },
  { n:5, e:'🔍', k:'Active learners',
    s:'Children learn actively from day one, making sense of the world through people, surroundings, and experiences.',
    t:"Children are active learners from birth, constantly taking in and organizing information to create meaning through their relationships, their interactions with their environment, and their overall experiences." },
  { n:6, e:'🔥', k:'Motivation',
    s:'Children want to learn when they feel they belong, their work has purpose, and they have a say. Teachers build on each child\'s strengths and connect to home and community.',
    t:"Children's motivation to learn is increased when their learning environment fosters their sense of belonging, purpose, and agency. Curricula and teaching methods build on each child's assets by connecting their experiences in the school or learning environment to their home and community settings." },
  { n:7, e:'🔗', k:'Integrated',
    s:'Children learn across subjects all at once, so teachers must know each subject, how skills build in it, and how to teach it well.',
    t:"Children learn in an integrated fashion that cuts across academic disciplines or subject areas. Because the foundations of subject area knowledge are established in early childhood, educators need subject area-knowledge, an understanding of the learning progressions within each subject area, and pedagogical knowledge about teaching each subject area's content effectively." },
  { n:8, e:'🪜', k:'Just beyond',
    s:'Children grow when a task is a little harder than what they can already do, and they get lots of chances to practice and think it over.',
    t:"Development and learning advance when children are challenged to achieve at a level just beyond their current mastery and when they have many opportunities to reflect on and practice newly acquired skills." },
  { n:9, e:'💻', k:'Technology',
    s:'Technology and interactive media can help children learn when adults use them thoughtfully and on purpose.',
    t:"Used responsibly and intentionally, technology and interactive media can be valuable tools for supporting children's development and learning." }
];

/* ================= LEARNING PATH =================
   Every principle climbs a ladder on its exact wording:
   20% of words hidden -> 40% -> 60% -> 80% -> the whole thing from memory.
   Mastered = MASTER perfect from-memory recalls, spaced out over days. */
const STAGE_FRACS = [0.2, 0.4, 0.6, 0.8, 1];
const STAGE_NAMES = ['20% hidden', '40% hidden', '60% hidden', '80% hidden', 'From memory'];
const STAGE_SHORT = ['20%', '40%', '60%', '80%', 'Recall'];
const LAST = STAGE_NAMES.length - 1;
const NEED = [1, 1, 1, 2];   // passes needed to climb out of each practice step
const MASTER = 3;            // perfect from-memory recalls needed for "Mastered"
const PASS = 0.9;            // practice steps pass at 90%; the final step needs 100%
const STOP = new Set('the and that with their from each both also when they have which through within across must can are for its our into than this these those between because although been were was has had who whom while about such other more most some any all'.split(' '));

/* ================= HELPERS ================= */
const h = (tag, attrs, ...kids) => {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)) { if (c == null || c === false) continue; el.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return el;
};
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const IDS = P.map((_, i) => i);
const app = document.getElementById('app');

/* ================= STORAGE + SPACED REPETITION ================= */
const KEY = 'dap-memorize-v1';
const fresh = () => ({ v: 3, p: P.map(() => ({ stage: 0, streak: 0, due: 0, seen: false, misses: 0 })) });
function loadState() {
  let s = null;
  try { const raw = localStorage.getItem(KEY); if (raw) s = JSON.parse(raw); } catch (e) {}
  if (!s || !Array.isArray(s.p) || s.p.length !== P.length) return fresh();
  if (!s.v) { s.p.forEach(x => { x.stage = Math.max(0, (x.stage || 0) - 1); }); s.v = 2; }
  if (s.v === 2) { // old path: 0 summary, 1 partial, 2 full text
    s.p.forEach(x => {
      if (x.stage === 2 && x.streak >= 4) { x.stage = LAST; x.streak = MASTER; }
      else { x.stage = [0, 1, 3][Math.min(2, x.stage || 0)]; x.streak = 0; }
    });
    s.v = 3;
  }
  return s;
}
let state = loadState();
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

const MIN = 60e3, DAY = 864e5, INT = [10 * MIN, DAY, 3 * DAY, 7 * DAY, 14 * DAY, 30 * DAY];

/* level = which step a task exercises (0 = 20% hidden ... 4 = from memory).
   A pass only moves a principle forward if level >= its current step.
   A miss (or using a hint) resets the streak and brings it back soon.
   Returns 'up' when the principle climbed a step. */
function record(i, ok, level) {
  const s = state.p[i], now = Date.now(); let out = null;
  s.seen = true;
  if (!ok) {
    s.streak = 0; s.misses = (s.misses || 0) + 1; s.due = now + 2 * MIN;
    if (s.misses >= 3 && s.stage > 0) { s.stage--; s.misses = 0; }
  } else {
    s.misses = 0;
    if (level >= s.stage) {
      s.streak++;
      if (s.stage < LAST && s.streak >= NEED[s.stage]) { s.stage++; s.streak = 0; s.due = now; out = 'up'; }
      else s.due = now + (s.stage < LAST ? 10 * MIN : INT[Math.min(s.streak - 1, INT.length - 1)]);
    }
  }
  save(); return out;
}
/* From-memory attempts: 100% counts toward mastery, 90%+ counts as an 80%-step pass. */
function recordRecall(i, res) {
  if (res.hints) return record(i, false, LAST);
  if (res.perfect) return record(i, true, LAST);
  if (res.acc >= PASS) return record(i, true, LAST - 1);
  return record(i, false, LAST);
}
const TOTAL_STEPS = NEED.reduce((a, b) => a + b, 0) + MASTER;
const steps = s => NEED.slice(0, s.stage).reduce((a, b) => a + b, 0) + Math.min(s.streak, s.stage < LAST ? NEED[s.stage] : MASTER);
const progress = i => steps(state.p[i]) / TOTAL_STEPS;
const isMastered = s => s.stage === LAST && s.streak >= MASTER;
const stageLabel = s => isMastered(s) ? 'Mastered' : STAGE_NAMES[s.stage];
const stageCls = s => 'st' + (isMastered(s) ? 5 : s.stage);
const isDue = i => state.p[i].due <= Date.now();
function dueText(i) {
  const s = state.p[i]; if (!s.seen) return 'New';
  const d = s.due - Date.now();
  if (d <= 0) return 'Ready to review';
  if (d < 60 * MIN) return 'Review in ' + Math.ceil(d / MIN) + ' min';
  if (d < DAY) return 'Review in ' + Math.round(d / 36e5) + ' h';
  return 'Review in ' + Math.round(d / DAY) + ' d';
}

/* ================= TEXT / GRADING ================= */
const hasAl = s => /[A-Za-z0-9]/.test(s);
const norm = s => String(s).toLowerCase().replace(/[^a-z0-9]/g, '');
function tokenize(text) {
  return text.split(/\s+/).filter(Boolean).map(w => {
    const m = w.match(/^([^A-Za-z0-9]*)(.*?)([^A-Za-z0-9]*)$/);
    return { pre: m[1], core: m[2], suf: m[3] };
  });
}
const tokText = t => t.pre + t.core + t.suf;
const eligible = tokens => tokens.map((t, i) => hasAl(t.core) ? i : -1).filter(i => i >= 0);
const isContent = w => { const n = norm(w); return n.length > 3 && !STOP.has(n); };
function pickHidden(tokens, frac, mode) {
  const el = eligible(tokens), n = Math.max(1, Math.round(el.length * frac));
  let order;
  if (mode === 'content') order = [...shuffle(el.filter(i => isContent(tokens[i].core))), ...shuffle(el.filter(i => !isContent(tokens[i].core)))];
  else order = shuffle(el);
  return new Set(order.slice(0, n));
}
const initials = tokens => tokens.map(t => hasAl(t.core) ? t.pre + t.core[0] + t.suf : t.pre + t.suf).join(' ');
/* Split a principle into short phrases at punctuation, then break up long runs. */
function phrases(text) {
  const runs = []; let cur = [];
  tokenize(text).forEach(t => {
    if (!hasAl(t.core)) { if (cur.length) runs.push(cur); cur = [t]; return; }
    cur.push(t);
    if (/[,;.:)]/.test(t.suf)) { runs.push(cur); cur = []; }
  });
  if (cur.length) runs.push(cur);
  const out = [];
  runs.forEach(r => {
    if (r.length <= 7) { out.push(r); return; }
    const parts = Math.ceil(r.length / 6), size = Math.ceil(r.length / parts);
    for (let k = 0; k < r.length; k += size) out.push(r.slice(k, k + size));
  });
  return out.map(r => r.map(tokText).join(' '));
}
function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
/* forgiving: ignores case/punctuation, allows a one-letter typo on words of 4+ letters */
const eqw = (a, b) => !!a && !!b && (a === b || (b.length >= 4 && lev(a, b) <= 1));
const match = (typed, core) => eqw(norm(typed), norm(core));
function lcsMark(A, B) {
  const n = A.length, m = B.length;
  const d = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = 1; i <= n; i++) for (let j = 1; j <= m; j++)
    d[i][j] = eqw(B[j - 1], A[i - 1]) ? d[i - 1][j - 1] + 1 : Math.max(d[i - 1][j], d[i][j - 1]);
  const hit = new Array(n).fill(false); let i = n, j = m;
  while (i > 0 && j > 0) {
    if (eqw(B[j - 1], A[i - 1]) && d[i][j] === d[i - 1][j - 1] + 1) { hit[i - 1] = true; i--; j--; }
    else if (d[i - 1][j] >= d[i][j - 1]) i--; else j--;
  }
  return { hit, len: d[n][m] };
}

/* ================= UI COMPONENTS ================= */
function seg(opts, val, on) {
  const wrap = h('div', { class: 'seg' });
  const render = () => wrap.replaceChildren(...opts.map(([v, l]) =>
    h('button', { type: 'button', class: 'segb' + (v === val ? ' on' : ''), onclick: () => { val = v; render(); on(v); } }, l)));
  render(); return wrap;
}
function shell(title) {
  app.replaceChildren(); window.scrollTo(0, 0);

/* Fill-in-the-blank. o: {tokens, hidden:Set, afterGrade(res, actionsEl)} */
function cloze(o) {
  const root = h('div', { class: 'cloze' });
  const para = h('p', { class: 'cloze-text' });
  const blanks = []; let last = null, hints = 0, graded = false;
  const fb = h('div'), actions = h('div', { class: 'actions' });
  o.tokens.forEach((t, i) => {
    if (!o.hidden.has(i)) { para.append(tokText(t), ' '); return; }
    const inp = h('input', { type: 'text', autocomplete: 'off', autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false', 'aria-label': 'blank ' + (blanks.length + 1) });
    inp.style.width = (Math.max(t.core.length, 3) + 1.6) + 'ch';
    const b = { t, inp, hint: 0 };
    b.wrap = h('span', { class: 'blank' }, t.pre, inp, t.suf);
    blanks.push(b);
    inp.addEventListener('focus', () => { last = b; });
    inp.addEventListener('keydown', e => {
      const k = blanks.indexOf(b);
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        if (k < blanks.length - 1) blanks[k + 1].inp.focus(); else if (e.key === 'Enter') check();
      } else if (e.key === 'Backspace' && inp.value === '' && k > 0) { e.preventDefault(); blanks[k - 1].inp.focus(); }
    });
    para.append(b.wrap, ' ');
  });
  const hintBtn = h('button', { class: 'btn ghost', type: 'button', onclick: () => {
    if (graded) return;
    const b = (last && norm(last.inp.value) !== norm(last.t.core)) ? last : blanks.find(x => norm(x.inp.value) !== norm(x.t.core));
    if (!b) return;
    b.hint = Math.min(b.hint + 1, b.t.core.length); hints++;
    const rev = b.t.core.slice(0, b.hint);
    if (!norm(b.inp.value).startsWith(norm(rev))) b.inp.value = rev;
    b.inp.focus(); hintBtn.textContent = '💡 Hint (' + hints + ' used)';
  } }, '💡 Hint');
  actions.append(h('button', { class: 'btn primary', type: 'button', onclick: () => check() }, 'Check'), hintBtn);
  function check() {
    if (graded) return; graded = true; let c = 0;
    blanks.forEach(b => {
      const typed = b.inp.value.trim(), ok = match(typed, b.t.core); if (ok) c++;
      b.wrap.className = 'blank ' + (ok ? 'ok' : 'bad');
      b.wrap.replaceChildren(b.t.pre, ok ? '' : (typed ? h('s', { class: 'typed' }, typed) : ''), h('span', { class: 'ans' }, b.t.core), b.t.suf);
    });
    const total = blanks.length, acc = total ? c / total : 1;
    const res = { ok: acc >= PASS && hints === 0, acc, perfect: c === total, hints };
    fb.className = 'fb ' + (res.ok ? 'ok' : 'no');
    fb.textContent = gradeMsg(c + ' of ' + total + ' correct', res.ok, res.perfect, hints);
    actions.replaceChildren(); o.afterGrade(res, actions);
  }
  root.append(para, fb, actions);
  setTimeout(() => blanks[0] && blanks[0].inp.focus(), 30);
  return root;
}

/* Type the whole principle.
   o: {tokens, afterGrade, pass (default 0.9), cue (text shown above, e.g. first letters),
       live (color each word as you type), hint (false to hide the hint button)} */
function recall(o) {
  const root = h('div');
  const words = eligible(o.tokens), A = words.map(i => norm(o.tokens[i].core));
  const pass = o.pass == null ? PASS : o.pass;
  const ta = h('textarea', { rows: 6, placeholder: 'Type the full principle…', spellcheck: 'false', autocapitalize: 'off', autocorrect: 'off', autocomplete: 'off' });
  const hintBox = h('div'), fb = h('div'), out = h('div'), actions = h('div', { class: 'actions' });
  const liveView = o.live ? h('div', { class: 'liveview' }) : null, count = o.live ? h('div', { class: 'muted small' }) : null;
  let hints = 0, graded = false;
  const parse = () => {
    const raw = ta.value, parts = raw.split(/\s+/).filter(Boolean);
    const done = (!raw || /\s$/.test(raw)) ? parts : parts.slice(0, -1);
    return { done, typing: done.length < parts.length ? parts[parts.length - 1] : '' };
  };
  function renderLive() {
    if (!o.live || graded) return;
    const { done, typing } = parse();
    liveView.replaceChildren(...done.flatMap((w, j) => [h('span', { class: j < A.length && eqw(norm(w), A[j]) ? 'hit' : 'miss' }, w), ' ']), typing ? h('span', { class: 'typing' }, typing) : '');
    count.textContent = Math.min(done.length, A.length) + ' of ' + A.length + ' words';
  }
  if (o.live) { ta.addEventListener('input', renderLive); renderLive(); }
  const hintLabel = o.live ? '💡 Next word' : '💡 First letters';
  const hintBtn = o.hint === false ? null : h('button', { class: 'btn ghost', type: 'button', onclick: () => {
    if (graded) return; hints++;
    if (o.live) {
      const { done } = parse(), k = done.length;
      if (k < words.length) { ta.value = [...done, tokText(o.tokens[words[k]])].join(' ') + ' '; renderLive(); ta.focus(); }
    } else hintBox.replaceChildren(h('div', { class: 'hintline' }, initials(o.tokens)));
    hintBtn.textContent = hintLabel + ' (' + hints + ' used)';
  } }, hintLabel);
  function check() {
    if (graded) return; graded = true;
    const B = ta.value.split(/\s+/).map(norm).filter(Boolean);
    const { hit, len } = lcsMark(A, B);
    const acc = len / Math.max(A.length, B.length, 1), perfect = len === A.length && B.length === A.length;
    const res = { ok: (pass >= 1 ? perfect : acc >= pass) && hints === 0, acc, perfect, hints };
    ta.disabled = true; hintBox.replaceChildren();
    const orig = h('p', { class: 'cloze-text', style: 'line-height:1.9' }); let k = 0;
    o.tokens.forEach(t => {
      if (!hasAl(t.core)) { orig.append(tokText(t), ' '); return; }
      orig.append(h('span', { class: hit[k++] ? 'hit' : 'miss' }, tokText(t)), ' ');
    });
    out.replaceChildren(h('div', { class: 'muted', style: 'margin-top:12px' }, 'Original (green = you recalled it, red = still to learn):'), orig);
    const tip = pass >= 1 && acc >= PASS ? 'So close! Every word is needed for this step.' : 'Aim for ' + Math.round(pass * 100) + '% to move up.';
    fb.className = 'fb ' + (res.ok ? 'ok' : 'no');
    fb.textContent = gradeMsg(Math.floor(acc * 100) + '% word match', res.ok, perfect, hints, tip);
    actions.replaceChildren(); o.afterGrade(res, actions);
  }
  ta.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); check(); } });
  actions.append(h('button', { class: 'btn primary', type: 'button', onclick: check }, 'Check'), hintBtn);
  root.append(o.cue ? h('div', { class: 'hintline cue' }, o.cue) : null, liveView, count, ta, hintBox, fb, out, actions,
    h('p', { class: 'muted small' }, 'Tip: Ctrl/⌘ + Enter to check.'));
  setTimeout(() => ta.focus(), 30);
  return root;
}

/* Phrase scramble. o: {text, afterGrade(res, actions, retry)} */
function scramble(o) {
  const parts = phrases(o.text);
  let order; do { order = shuffle(parts.map((_, k) => k)); } while (parts.length > 2 && order.every((v, k) => v === k));
  let placed = [], graded = false;
  const root = h('div'), ans = h('div', { class: 'answer' }), pool = h('div', { class: 'pool' }), fb = h('div'), actions = h('div', { class: 'actions' });
  const checkBtn = h('button', { class: 'btn primary', type: 'button', disabled: true, onclick: () => check() }, 'Check');
  function draw() {
    ans.replaceChildren(...placed.map((k, j) => h('button', { type: 'button', class: 'chip', onclick: () => { if (graded) return; placed.splice(j, 1); draw(); } }, parts[k])));
    pool.replaceChildren(...order.filter(k => !placed.includes(k)).map(k => h('button', { type: 'button', class: 'chip', onclick: () => { if (graded) return; placed.push(k); draw(); } }, parts[k])));
    checkBtn.disabled = placed.length !== parts.length;
  }
  function check() {
    graded = true; let c = 0;
    [...ans.children].forEach((el, j) => { const ok = parts[placed[j]] === parts[j]; if (ok) c++; el.classList.add(ok ? 'ok' : 'bad'); });
    const res = { ok: c === parts.length, acc: c / parts.length, perfect: c === parts.length, hints: 0 };
    fb.className = 'fb ' + (res.ok ? 'ok' : 'no');
    fb.textContent = res.ok ? 'Perfect order! ✓' : c + ' of ' + parts.length + ' phrases in the right spot. Keep going, you\'re getting there!';
    actions.replaceChildren();
    if (!res.ok) actions.append(h('div', { style: 'flex:1 1 100%' }, h('div', { class: 'eyebrow' }, 'Correct order'), h('p', { style: 'margin:0' }, o.text)));
    o.afterGrade(res, actions);
  }
  actions.append(checkBtn, h('button', { class: 'btn ghost', type: 'button', onclick: () => { if (!graded) { placed = []; draw(); } } }, 'Clear'));
  draw();
  root.append(ans, pool, fb, actions);
  return root;
}

/* ================= SMART STUDY ================= */
function startSmart(opt) {
  let ids;
  if (opt.only != null) ids = [opt.only];
  else if (opt.ahead) ids = [...IDS].sort((a, b) => state.p[a].due - state.p[b].due).slice(0, 5);
  else ids = IDS.filter(isDue).sort((a, b) => state.p[a].due - state.p[b].due).slice(0, 12);
  if (!ids.length) return home();
  const S = shell('Smart study');
  const before = Object.fromEntries(ids.map(i => [i, stageLabel(state.p[i])]));
  const queue = [...ids], total = ids.length, tries = {}, first = {}; let done = 0;
  function next() {
    if (!queue.length) return finish();
    const i = queue.shift();
    S.setProg(done / total); S.meta.textContent = Math.min(done + 1, total) + ' / ' + total;
    smartTask(i, S, (ok, up) => {
      if (!(i in first)) first[i] = ok;
      tries[i] = (tries[i] || 0) + 1;
      /* retry a miss once; after a climb, try the next step right away (max 3 tries per principle) */
      if (tries[i] < 3 && (up || (!ok && tries[i] === 1))) queue.push(i); else done++;
      next();
    });
  }
  function finish() {
    S.setProg(1); S.meta.textContent = '';
    const passed = ids.filter(i => first[i]).length;
    S.body.replaceChildren(
      h('div', { class: 'card' },
        h('h1', null, passed === total ? 'Nice work 🎉' : 'Good session!'),
        h('p', { class: 'sub' }, passed + ' of ' + total + ' right on the first try.' + (passed < total ? ' The rest will come back soon for another look.' : '')),
        h('div', { class: 'plist' }, ids.map(i => h('div', { class: 'pcard', style: 'cursor:default' },
          h('span', { class: 'em' }, P[i].e),
          h('div', null, h('div', { class: 'nm' }, h('span', null, '#' + P[i].n), P[i].k), ladder(state.p[i])),
          h('div', { class: 'rt' }, before[i] === stageLabel(state.p[i]) ? stageLabel(state.p[i]) : before[i] + ' → ' + stageLabel(state.p[i]), h('div', null, dueText(i))))))),
      h('div', { class: 'actions' },
        h('button', { class: 'btn primary', onclick: home }, 'Home'),
        h('button', { class: 'btn', onclick: () => startSmart(opt.only != null ? opt : { ahead: !IDS.some(isDue) }) }, 'Keep going')));
  }
  next();
}
function smartTask(i, S, cb) {
  const p = P[i], s = state.p[i], st = s.stage;
  function stageTask() {
    const badge = h('div', { class: 'badge st' + st }, 'Step ' + (st + 1) + ' of ' + STAGE_NAMES.length + ' · ' + (isMastered(s) ? 'Mastered: keep it fresh' : STAGE_NAMES[st]));
    const finishTask = (res, actions, up) => {
      if (up) actions.append(h('div', { class: 'fb ok', style: 'flex:1 1 100%;margin-top:0' }, '⬆️ Moved up to: ' + STAGE_NAMES[state.p[i].stage]));
      if (!res.ok) actions.append(h('div', { style: 'flex:1 1 100%' }, h('p', { class: 'muted', style: 'margin:0 0 8px' }, "Here's a quick refresher:"), teach(i)));
      actions.append(h('button', { class: 'btn primary', onclick: () => cb(res.ok, up) }, 'Continue →'));
    };
    const tokens = tokenize(p.t);
    if (st < LAST) {
      S.body.replaceChildren(badge, ...head(i), h('div', { class: 'prompt' }, 'Fill in the missing words.'),
        cloze({ tokens, hidden: pickHidden(tokens, STAGE_FRACS[st], 'random'), afterGrade: (res, actions) => finishTask(res, actions, record(i, res.ok, st) === 'up') }));
    } else {
      S.body.replaceChildren(badge, ...head(i), h('div', { class: 'prompt' }, 'Type the whole principle from memory. Every word counts here.'),
        recall({ tokens, pass: 1, afterGrade: (res, actions) => finishTask(res, actions, recordRecall(i, res) === 'up') }));
    }
  }
  if (!s.seen) {
    S.body.replaceChildren(h('div', { class: 'badge st0' }, 'New principle: read it a few times first'), teach(i),
      h('div', { class: 'actions' }, h('button', { class: 'btn primary', onclick: stageTask }, 'Start →')));
  } else stageTask();
}

let pickDiff = 1;
function pickSetup() {
  const extra = h('div', { class: 'field' }, h('label', null, 'Words to pick'),
    seg([[0, '20%'], [1, '40%'], [2, '60%']], pickDiff, v => { pickDiff = v; }));
  const allWords = [...new Set(P.flatMap(p => tokenize(p.t).map(t => t.core)).filter(hasAl))];
  drill('Pick a word', 'Work through the blanks in order. For each one, pick the right word from three choices.', extra, function run(S, i, next, options) {
    const tokens = tokenize(P[i].t);
    const hidden = [...pickHidden(tokens, STAGE_FRACS[pickDiff], 'content')].sort((a, b) => a - b);
    const result = {}; let k = 0, right = 0;
    const para = h('p', { class: 'cloze-text' }), optsEl = h('div', { class: 'pickopts' }), fb = h('div'), actions = h('div', { class: 'actions' });
    const matchCase = (w, ans) => /^[A-Z]/.test(ans) ? w[0].toUpperCase() + w.slice(1) : w.toLowerCase();
    function choices(ans) {
      const content = isContent(ans), n = norm(ans);
      const pool = shuffle(allWords.filter(w => isContent(w) === content && norm(w) !== n));
      const close = pool.filter(w => Math.abs(w.length - ans.length) <= 3);
      const picks = [...new Set([...close, ...pool].map(w => matchCase(w, ans)))].filter(w => norm(w) !== n).slice(0, 2);
      return shuffle([ans, ...picks]);
    }
    function draw() {
      S.meta.textContent = Math.min(k + 1, hidden.length) + ' / ' + hidden.length;
      S.setProg(k / hidden.length);
      para.replaceChildren(...tokens.flatMap((t, j) => {
        if (!hidden.includes(j)) return [tokText(t), ' '];
        if (j in result) return [h('span', { class: 'blank ' + (result[j] ? 'ok' : 'bad') }, t.pre, h('span', { class: 'ans' }, t.core), t.suf), ' '];
        return [h('span', { class: 'blank' }, t.pre, h('span', { class: 'slot' + (j === hidden[k] ? ' cur' : '') }, j === hidden[k] ? '?' : ' '), t.suf), ' '];
      }));
      if (k >= hidden.length) return done();
      const ans = tokens[hidden[k]].core;
      optsEl.replaceChildren(...choices(ans).map((w, n) => h('button', { class: 'opt', type: 'button', onclick: () => choose(w) }, h('span', { class: 'key' }, n + 1), w)));
    }
    function choose(w) {
      const j = hidden[k], ok = norm(w) === norm(tokens[j].core);
      result[j] = ok; if (ok) right++; k++; draw();
    }
    function done() {
      document.removeEventListener('keydown', onKey);
      optsEl.replaceChildren(); S.setProg(1);
      const n = hidden.length, acc = right / n, ok = acc >= PASS;
      fb.className = 'fb ' + (ok ? 'ok' : 'no');
      fb.textContent = gradeMsg(right + ' of ' + n + ' correct', ok, right === n, 0);
      record(i, ok, pickDiff);
      endBtns(actions, () => run(S, i, next, options), next, options);
    }
    function onKey(e) {
      if (!document.body.contains(optsEl)) return document.removeEventListener('keydown', onKey);
      const b = optsEl.children[+e.key - 1]; if (b) b.click();
    }
    document.addEventListener('keydown', onKey);
    S.body.replaceChildren(...head(i), h('div', { class: 'prompt' }, 'Pick the missing word. Keys 1, 2, 3 work too.'), para, optsEl, fb, actions);
    draw();
  });
}

function progSetup() {
  drill('Progressive removal', 'Five rounds on one principle: 20%, 40%, 60%, 80%, then 100% of the words hidden. Each round hides more of the same random set. Reach 90% to move up; the last round is typing it all from memory.', null, (S, i, next, options) => {
    const tokens = tokenize(P[i].t), order = shuffle(eligible(tokens));
    let r = 0;
    function round() {
      const frac = STAGE_FRACS[r];
      S.setProg(r / STAGE_FRACS.length); S.meta.textContent = 'Round ' + (r + 1) + ' / ' + STAGE_FRACS.length;
      const top = [...head(i), h('div', { class: 'prompt' }, frac === 1 ? 'All words removed. Type the whole principle.' : Math.round(frac * 100) + '% of the words are hidden.')];
      const after = (res, actions) => {
        if (frac === 1) recordRecall(i, res); else record(i, res.ok, r);
        if (res.ok && r === LAST) {
          S.setProg(1);
          actions.append(h('div', { class: 'fb ok', style: 'flex:1 1 100%;margin-top:0' }, 'Every word removed and you still recited it. 🎉'),
            h('button', { class: 'btn primary', onclick: next }, 'Next principle →'), h('button', { class: 'btn', onclick: home }, 'Home'));
        } else if (res.ok) actions.append(h('button', { class: 'btn primary', onclick: () => { r++; round(); } }, 'Next round →'));
        else actions.append(h('button', { class: 'btn primary', onclick: round }, 'Try this round again'),
          h('button', { class: 'btn', onclick: () => { r = Math.max(0, r - 1); round(); } }, 'Go back a round'));
      };
      if (frac === 1) S.body.replaceChildren(...top, recall({ tokens, afterGrade: after }));
      else S.body.replaceChildren(...top, cloze({ tokens, hidden: new Set(order.slice(0, Math.max(1, Math.round(order.length * frac)))), afterGrade: after }));
    }
    round();
  });
}

function firstSetup() {
  drill('First-letter recall', 'Shows the first letter of every word as a cue. Type the full principle. Reach 90% to pass.', null, function run(S, i, next, options) {
    const tokens = tokenize(P[i].t);
    S.meta.textContent = '';
    S.body.replaceChildren(...head(i), h('div', { class: 'prompt' }, 'Type the full principle using the first letters as your guide.'),
      recall({ tokens, cue: initials(tokens), hint: false, afterGrade: (res, actions) => {
        record(i, res.ok, LAST - 1); endBtns(actions, () => run(S, i, next, options), next, options);
      } }));
  });
}

function scrambleSetup() {
  drill('Phrase scramble', 'The principle is cut into short phrases. Tap them in the right order; tap a placed phrase to send it back.', null, function run(S, i, next, options) {
    S.meta.textContent = '';
    S.body.replaceChildren(...head(i), h('div', { class: 'prompt' }, 'Put the phrases in order.'),
      scramble({ text: P[i].t, afterGrade: (res, actions) => {
        record(i, res.ok, 1); endBtns(actions, () => run(S, i, next, options), next, options);
      } }));
  });
}

function liveSetup() {
  drill('Live typing', 'Type the principle from memory. Each word turns green or red as soon as you finish it, so you catch slips right away. "Next word" helps if you\'re stuck.', null, function run(S, i, next, options) {
    S.meta.textContent = '';
    S.body.replaceChildren(...head(i), h('div', { class: 'prompt' }, 'Type the whole principle from memory.'),
      recall({ tokens: tokenize(P[i].t), live: true, afterGrade: (res, actions) => {
        recordRecall(i, res); endBtns(actions, () => run(S, i, next, options), next, options);
      } }));
  });
}

home();
</script>
