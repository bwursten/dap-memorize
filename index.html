<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DAP Memorize</title>
<style>
:root{
  --bg:#f6f6f2; --surface:#ffffff; --text:#1d1f23; --muted:#6b7078; --line:#e2e2dc;
  --accent:#3b5bdb; --accent-ink:#ffffff; --accent-soft:#e8edff;
  --good:#2b8a3e; --good-bg:#e6f4ea; --bad:#c92a2a; --bad-bg:#fdecec;
  --s0:#868e96; --s1:#3b82f6; --s2:#8b5cf6; --s3:#0d9488; --s4:#2b8a3e;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.05);
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#14161a; --surface:#1e2127; --text:#eceef1; --muted:#9aa1ab; --line:#30353d;
    --accent:#8aa0ff; --accent-ink:#0e1122; --accent-soft:#252b44;
    --good:#69db7c; --good-bg:#17301f; --bad:#ff8787; --bad-bg:#3a1c1c;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:780px;margin:0 auto;padding:16px 16px 56px}
h1{font-size:1.7rem;line-height:1.2;margin:8px 0 4px}
h2{font-size:1.05rem;margin:28px 0 10px;letter-spacing:.01em}
.sub{color:var(--muted);margin:0 0 16px}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.row{display:flex;flex-wrap:wrap;align-items:center}
.gap{gap:10px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:600;transition:transform .05s,background .15s}
.btn:hover{background:var(--accent-soft)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 12px;font-size:.9rem}
.btn.good{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.btn.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.55;cursor:default}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.topbar .ttl{font-weight:700;flex:1}
.topbar .meta{color:var(--muted);font-size:.9rem}
.prog{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:18px}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}

/* home */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{text-align:center;padding:12px 8px}
.stat b{display:block;font-size:1.5rem;line-height:1.1}
.stat span{color:var(--muted);font-size:.82rem}
.cta{width:100%;padding:16px;font-size:1.1rem;border-radius:12px}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.mode{text-align:left;cursor:pointer;display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.mode:hover{border-color:var(--accent)}
.mode .mi{font-size:1.6rem;line-height:1}
.mode b{display:block}
.mode small{color:var(--muted);display:block;line-height:1.35}
.plist{display:grid;gap:8px}
.pcard{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px}
.pcard:hover{border-color:var(--accent)}
.pcard .em{font-size:1.5rem}
.pcard .nm{font-weight:700}
.pcard .nm span{color:var(--muted);font-weight:600;margin-right:6px}
.pcard .bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.pcard .bar i{display:block;height:100%}
.pcard .rt{text-align:right;font-size:.8rem;color:var(--muted);white-space:nowrap}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:99px;color:#fff}
.st0{background:var(--s0)}.st1{background:var(--s1)}.st2{background:var(--s2)}.st3{background:var(--s3)}.st4{background:var(--s4)}
.foot{margin-top:34px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;color:var(--muted);font-size:.85rem}

/* generic study */
.prompt{font-weight:700;margin:4px 0 10px}
.badge{display:inline-block;font-size:.78rem;font-weight:700;color:#fff;padding:3px 10px;border-radius:99px;margin-bottom:10px}
.pchip{display:inline-flex;align-items:center;gap:8px;background:var(--accent-soft);border-radius:99px;padding:4px 12px;font-weight:700;margin-bottom:10px}
.pchip .em{font-size:1.2rem}
.pchip .num{color:var(--muted)}
.teach .t-head{display:flex;gap:14px;align-items:center;margin-bottom:8px}
.big-em{font-size:2.6rem;line-height:1}
.t-num{color:var(--muted);font-size:.85rem;font-weight:600}
.t-kw{font-size:1.4rem;font-weight:800}
.eyebrow{font-size:.72rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin:14px 0 2px}
.t-sum{font-weight:600;margin:0}
.t-full{margin:0;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.fb{margin-top:14px;padding:10px 14px;border-radius:10px;font-weight:600}
.fb.ok{background:var(--good-bg);color:var(--good)}
.fb.no{background:var(--bad-bg);color:var(--bad)}

/* cloze */
.cloze-text{font-size:1.1rem;line-height:2.5;margin:8px 0}
.blank{white-space:nowrap}
.blank input{border:0;border-bottom:2px solid var(--accent);background:var(--accent-soft);border-radius:6px 6px 0 0;padding:1px 4px;text-align:center;outline:none;font-size:1rem}
.blank input:focus{background:var(--surface);box-shadow:0 0 0 2px var(--accent)}
.blank.ok .ans{color:var(--good);background:var(--good-bg);border-radius:6px;padding:1px 5px;font-weight:700}
.blank.bad .ans{color:var(--bad);background:var(--bad-bg);border-radius:6px;padding:1px 5px;font-weight:700}
.blank .typed{color:var(--muted);margin-right:4px}
textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;resize:vertical;font-size:1.02rem;line-height:1.6}
textarea:focus{outline:2px solid var(--accent)}
.hit{background:var(--good-bg);color:var(--good);border-radius:4px;padding:0 2px}
.miss{background:var(--bad-bg);color:var(--bad);border-radius:4px;padding:0 2px;font-weight:700}
.hintline{font-family:ui-monospace,Menlo,monospace;color:var(--muted);letter-spacing:.06em;margin:8px 0;word-break:break-word}

/* choice */
.opts{display:grid;gap:8px;margin-top:6px}
.opt{text-align:left;width:100%;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-weight:600}
.opt:hover:not([disabled]){border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.scn{font-size:1.1rem;margin:6px 0 14px}

/* flashcards */
.fcard{display:block;width:100%;min-height:260px;text-align:center;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:24px;box-shadow:var(--shadow);animation:pop .18s ease}
.fcard.flipped{background:var(--accent-soft)}
.fcard .em{font-size:4rem;line-height:1.1}
.fcard .k{font-size:1.8rem;font-weight:800;margin:6px 0}
.fcard .n{color:var(--muted);font-weight:700}
.fcard .s{font-weight:600;margin:8px 0}
.fcard .f{color:var(--muted);font-size:.95rem;text-align:left;margin-top:10px}
.fcard .tap{color:var(--muted);font-size:.85rem;margin-top:14px}
@keyframes pop{from{transform:scale(.98);opacity:.6}to{transform:none;opacity:1}}

/* seg + form */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.segb{appearance:none;border:0;background:transparent;padding:8px 12px;cursor:pointer;font-weight:600;font-size:.92rem}
.segb.on{background:var(--accent);color:var(--accent-ink)}
.field{margin:14px 0}
.field label{display:block;font-weight:700;margin-bottom:6px}
select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;min-width:220px;max-width:100%}

/* matching */
.mgrid{display:grid;gap:8px}
.slot{display:grid;grid-template-columns:minmax(70px,auto) 1fr;gap:10px;align-items:stretch}
.slot .lab{display:flex;align-items:center;font-weight:700;padding:6px 4px}
.drop{min-height:44px;border:2px dashed var(--line);border-radius:10px;padding:8px 12px;display:flex;align-items:center;cursor:pointer;transition:border-color .1s,background .1s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop.filled{border-style:solid;border-color:var(--good);background:var(--good-bg);color:var(--good);font-weight:600;cursor:default}
.drop.shake{animation:shake .35s;border-color:var(--bad)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;cursor:grab;font-weight:600;box-shadow:var(--shadow);text-align:left}
.chip.sel{outline:3px solid var(--accent);background:var(--accent-soft)}
.chip.long{flex:1 1 100%}

@media (max-width:520px){
  .stats{gap:6px}
  .cloze-text{font-size:1.02rem}
  .fcard .em{font-size:3.2rem}
  .slot{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';

/* ================= CONTENT ================= */
const P = [
  { n:1, e:'🧬', k:'Dynamic',
    s:'Who a child is by nature and the world around them keep shaping each other as the child grows.',
    t:"Development and learning are dynamic processes that reflect the complex interplay between a child's biological characteristics and the environment, each shaping the other as well as future patterns of growth.",
    sc:[
      "A child who is naturally very sensitive to noise is given a quiet corner. Feeling calm there, she gradually becomes more willing to join busy group activities, which in turn changes how she responds to noise.",
      "A teacher notices that a child's temperament affects how adults respond to him, and that those responses then shape how he behaves later on.",
      "A child born prematurely makes big gains over several months in a responsive, language-rich classroom."
    ] },
  { n:2, e:'🧩', k:'All domains',
    s:'Body, thinking, feelings, and language all matter, and growth in one helps the others.',
    t:"All domains of child development – physical development, cognitive development, social and emotional development, and linguistic development (including bilingual or multilingual development), as well as approaches to learning – are important; each domain both supports and is supported by the others.",
    sc:[
      "A teacher realizes that a child who struggles to make friends is also behind in language, and plans to support both because progress in one will help the other.",
      "A child who is physically exhausted can't focus or manage feelings, so the teacher adjusts the schedule rather than treating attention as a purely mental issue.",
      "A program gives equal attention to motor, thinking, social-emotional, and language growth rather than focusing on one area."
    ] },
  { n:3, e:'🎲', k:'Play',
    s:'Play is how children learn happily, and every child needs it from birth to age 8.',
    t:"Play promotes joyful learning that fosters self-regulation, language, cognitive and social competencies as well as content knowledge across disciplines. Play is essential for all children, birth through age 8.",
    sc:[
      "A first-grade teacher protects daily time for blocks and pretend play because it builds self-regulation, language, and social skills.",
      "A director defends keeping play in kindergarten and second grade, explaining it is essential for children right up through age 8.",
      "Children running a pretend restaurant negotiate roles, talk constantly, and practice writing menus, all while having fun."
    ] },
  { n:4, e:'🌍', k:'Variation',
    s:'Children follow a general pattern of growth, but culture, experiences, and each child\'s own makeup make every child different.',
    t:"Although general progression of development and learning can be identified, variations due to cultural contexts, experiences, and individual differences must also be considered.",
    sc:[
      "A teacher uses a milestone chart as a general guide but isn't alarmed that a child from a multilingual home speaks English later, and considers the child's cultural and language experiences.",
      "Two four-year-olds are the same age: one reads simple words and the other is still learning letters. The teacher plans differently for each.",
      "A teacher learns that norms about eye contact differ across families' cultures and adjusts her expectations."
    ] },
  { n:5, e:'🔍', k:'Active learners',
    s:'Children learn actively from day one, making sense of the world through people, surroundings, and experiences.',
    t:"Children are active learners from birth, constantly taking in and organizing information to create meaning through their relationships, their interactions with their environment, and their overall experiences.",
    sc:[
      "A baby bangs a spoon and watches what happens, then tries it on a different surface. She is running her own experiments.",
      "Rather than only lecturing, a teacher sets out ramps and balls so children can explore, test ideas, and make sense of motion themselves.",
      "Newborns study caregivers' faces and voices, already organizing what they take in."
    ] },
  { n:6, e:'🔥', k:'Motivation',
    s:'Children want to learn when they feel they belong, their work has purpose, and they have a say. Teachers build on each child\'s strengths and connect to home and community.',
    t:"Children's motivation to learn is increased when their learning environment fosters their sense of belonging, purpose, and agency. Curricula and teaching methods build on each child's assets by connecting their experiences in the school or learning environment to their home and community settings.",
    sc:[
      "A teacher invites families to share traditions and adds books in children's home languages so each child feels they belong.",
      "Children help plan a class garden, deciding what to grow and who does which job, so the work feels purposeful and they have a say.",
      "A teacher builds a lesson on a child's strength, his knowledge of his grandfather's fishing boat, linking home life to classroom learning."
    ] },
  { n:7, e:'🔗', k:'Integrated',
    s:'Children learn across subjects all at once, so teachers must know each subject, how skills build in it, and how to teach it well.',
    t:"Children learn in an integrated fashion that cuts across academic disciplines or subject areas. Because the foundations of subject area knowledge are established in early childhood, educators need subject area-knowledge, an understanding of the learning progressions within each subject area, and pedagogical knowledge about teaching each subject area's content effectively.",
    sc:[
      "A project on building a bridge brings math, science, literacy, and art together in one investigation.",
      "A teacher studies how early number sense develops and how to teach it well, because the foundations of math are laid in the early years.",
      "A read-aloud about seasons leads children to chart the weather, draw observations, and write captions, all in one connected unit."
    ] },
  { n:8, e:'🪜', k:'Just beyond',
    s:'Children grow when a task is a little harder than what they can already do, and they get lots of chances to practice and think it over.',
    t:"Development and learning advance when children are challenged to achieve at a level just beyond their current mastery and when they have many opportunities to reflect on and practice newly acquired skills.",
    sc:[
      "A teacher offers a puzzle slightly harder than last week's, gives a small hint, then lets the child redo it and talk about what worked.",
      "A child who has just learned to hop on one foot gets many chances to practice and is asked what felt different this time.",
      "A teacher notices a task is too easy for a child and nudges it to a level just out of reach, with support."
    ] },
  { n:9, e:'💻', k:'Technology',
    s:'Technology and interactive media can help children learn when adults use them thoughtfully and on purpose.',
    t:"Used responsibly and intentionally, technology and interactive media can be valuable tools for supporting children's development and learning.",
    sc:[
      "A teacher has a child record and replay her own story on a tablet, then talks with her about it.",
      "The class video-calls a grandparent overseas, and the teacher chose this interactive media on purpose to support a learning goal.",
      "A program selects digital tools carefully and limits their use so they add to, rather than replace, hands-on interaction."
    ] }
];
const STAGE_NAMES = ['Keyword','Summary','Partial text','Full text'];
const STOP = new Set('the and that with their from each both also when they have which through within across must can are for its our into than this these those between because although been were was has had who whom while about such other more most some any all'.split(' '));

/* ================= HELPERS ================= */
const h = (tag, attrs, ...kids) => {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)) { if (c == null || c === false) continue; el.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return el;
};
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const IDS = P.map((_, i) => i);
const app = document.getElementById('app');

/* ================= STORAGE + SPACED REPETITION ================= */
const KEY = 'dap-memorize-v1';
const fresh = () => ({ p: P.map(() => ({ stage: 0, streak: 0, due: 0, seen: false, misses: 0 })) });
function loadState() {
  let s = null;
  try { const raw = localStorage.getItem(KEY); if (raw) s = JSON.parse(raw); } catch (e) {}
  if (!s || !Array.isArray(s.p) || s.p.length !== P.length) s = fresh();
  return s;
}
let state = loadState();
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

const MIN = 60e3, DAY = 864e5, INT = [10 * MIN, DAY, 3 * DAY, 7 * DAY, 14 * DAY, 30 * DAY];

/* level = which stage the task exercises (0 keyword, 1 summary, 2 partial, 3 full).
   A correct answer only advances a principle if the task level >= its current stage.
   Any miss (including using a hint) resets the streak and brings it back soon. */
function record(i, ok, level) {
  const s = state.p[i], now = Date.now();
  s.seen = true;
  if (!ok) {
    s.streak = 0; s.misses = (s.misses || 0) + 1; s.due = now + 2 * MIN;
    if (s.misses >= 3 && s.stage > 0) { s.stage--; s.misses = 0; }
  } else {
    s.misses = 0;
    if (level >= s.stage) {
      s.streak++;
      if (s.stage < 3 && s.streak >= 2) { s.stage++; s.streak = 0; s.due = now + 10 * MIN; }
      else s.due = now + INT[Math.min(s.streak - 1, INT.length - 1)];
    }
  }
  save();
}
const steps = s => s.stage < 3 ? s.stage * 2 + Math.min(s.streak, 2) : 6 + Math.min(s.streak, 4);
const progress = i => steps(state.p[i]) / 10;
const isMastered = s => s.stage === 3 && s.streak >= 4;
const stageLabel = s => isMastered(s) ? 'Mastered' : STAGE_NAMES[s.stage];
const stageCls = s => 'st' + (isMastered(s) ? 4 : s.stage);
const isDue = i => state.p[i].due <= Date.now();
function dueText(i) {
  const s = state.p[i]; if (!s.seen) return 'New';
  const d = s.due - Date.now();
  if (d <= 0) return 'Ready to review';
  if (d < 60 * MIN) return 'Review in ' + Math.ceil(d / MIN) + ' min';
  if (d < DAY) return 'Review in ' + Math.round(d / 36e5) + ' h';
  return 'Review in ' + Math.round(d / DAY) + ' d';
}

/* ================= TEXT / GRADING ================= */
const hasAl = s => /[A-Za-z0-9]/.test(s);
const norm = s => String(s).toLowerCase().replace(/[^a-z0-9]/g, '');
function tokenize(text) {
  return text.split(/\s+/).filter(Boolean).map(w => {
    const m = w.match(/^([^A-Za-z0-9]*)(.*?)([^A-Za-z0-9]*)$/);
    return { pre: m[1], core: m[2], suf: m[3] };
  });
}
const eligible = tokens => tokens.map((t, i) => hasAl(t.core) ? i : -1).filter(i => i >= 0);
const isContent = w => { const n = norm(w); return n.length > 3 && !STOP.has(n); };
function pickHidden(tokens, frac, mode) {
  const el = eligible(tokens), n = Math.max(1, Math.round(el.length * frac));
  let order;
  if (mode === 'content') order = [...shuffle(el.filter(i => isContent(tokens[i].core))), ...shuffle(el.filter(i => !isContent(tokens[i].core)))];
  else order = shuffle(el);
  return new Set(order.slice(0, n));
}
function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
/* forgiving: ignores case/punctuation, allows one-letter typo on words of 4+ letters */
const eqw = (a, b) => !!a && !!b && (a === b || (b.length >= 4 && lev(a, b) <= 1));
const match = (typed, core) => eqw(norm(typed), norm(core));
function lcsMark(A, B) {
  const n = A.length, m = B.length;
  const d = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = 1; i <= n; i++) for (let j = 1; j <= m; j++)
    d[i][j] = eqw(B[j - 1], A[i - 1]) ? d[i - 1][j - 1] + 1 : Math.max(d[i - 1][j], d[i][j - 1]);
  const hit = new Array(n).fill(false); let i = n, j = m;
  while (i > 0 && j > 0) {
    if (eqw(B[j - 1], A[i - 1]) && d[i][j] === d[i - 1][j - 1] + 1) { hit[i - 1] = true; i--; j--; }
    else if (d[i - 1][j] >= d[i][j - 1]) i--; else j--;
  }
  return { hit, len: d[n][m] };
}
const PASS = 0.9;

/* ================= UI COMPONENTS ================= */
function seg(opts, val, on) {
  const wrap = h('div', { class: 'seg' });
  const render = () => wrap.replaceChildren(...opts.map(([v, l]) =>
    h('button', { type: 'button', class: 'segb' + (v === val ? ' on' : ''), onclick: () => { val = v; render(); on(v); } }, l)));
  render(); return wrap;
}
function shell(title) {
  app.replaceChildren(); window.scrollTo(0, 0);
  const meta = h('div', { class: 'meta' });

/* Fill-in-the-blank. o: {tokens, hidden:Set, afterGrade(res, actionsEl)} */
function cloze(o) {
  const root = h('div', { class: 'cloze' });
  const para = h('p', { class: 'cloze-text' });
  const blanks = []; let last = null, hints = 0, graded = false;
  const fb = h('div'), actions = h('div', { class: 'actions' });
  o.tokens.forEach((t, i) => {
    if (!o.hidden.has(i)) { para.append(t.pre + t.core + t.suf, ' '); return; }
    const inp = h('input', { type: 'text', autocomplete: 'off', autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false', 'aria-label': 'blank ' + (blanks.length + 1) });
    inp.style.width = (Math.max(t.core.length, 3) + 1.6) + 'ch';
    const b = { t, inp, hint: 0 };
    b.wrap = h('span', { class: 'blank' }, t.pre, inp, t.suf);
    blanks.push(b);
    inp.addEventListener('focus', () => { last = b; });
    inp.addEventListener('keydown', e => {
      const k = blanks.indexOf(b);
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        if (k < blanks.length - 1) blanks[k + 1].inp.focus(); else if (e.key === 'Enter') check();
      } else if (e.key === 'Backspace' && inp.value === '' && k > 0) { e.preventDefault(); blanks[k - 1].inp.focus(); }
    });
    para.append(b.wrap, ' ');
  });
  const hintBtn = h('button', { class: 'btn ghost', type: 'button', onclick: () => {
    if (graded) return;
    const b = (last && norm(last.inp.value) !== norm(last.t.core)) ? last : blanks.find(x => norm(x.inp.value) !== norm(x.t.core));
    if (!b) return;
    b.hint = Math.min(b.hint + 1, b.t.core.length); hints++;
    const rev = b.t.core.slice(0, b.hint);
    if (!norm(b.inp.value).startsWith(norm(rev))) b.inp.value = rev;
    b.inp.focus(); hintBtn.textContent = '💡 Hint (' + hints + ' used)';
  } }, '💡 Hint');
  const checkBtn = h('button', { class: 'btn primary', type: 'button', onclick: () => check() }, 'Check');
  actions.append(checkBtn, hintBtn);
  function check() {
    if (graded) return; graded = true; let c = 0;
    blanks.forEach(b => {
      const typed = b.inp.value.trim(), ok = match(typed, b.t.core); if (ok) c++;
      b.wrap.className = 'blank ' + (ok ? 'ok' : 'bad');
      b.wrap.replaceChildren(b.t.pre, ok ? '' : (typed ? h('s', { class: 'typed' }, typed) : ''), h('span', { class: 'ans' }, b.t.core), b.t.suf);
    });
    const total = blanks.length, acc = total ? c / total : 1;
    const res = { ok: acc >= PASS && hints === 0, acc, correct: c, total, hints };
    fb.className = 'fb ' + (res.ok ? 'ok' : 'no');
    fb.textContent = gradeMsg(c + ' of ' + total + ' correct', res.ok, c === total, hints);
    actions.replaceChildren(); o.afterGrade(res, actions);
  }
  root.append(para, fb, actions);
  setTimeout(() => blanks[0] && blanks[0].inp.focus(), 30);
  return root;
}

/* Full recall: type the whole thing. o: {tokens, afterGrade} */
function recall(o) {
  const root = h('div');
  const words = eligible(o.tokens);
  const A = words.map(i => norm(o.tokens[i].core));
  const ta = h('textarea', { rows: 7, placeholder: 'Type the principle from memory…', spellcheck: 'false' });
  const hintBox = h('div'), fb = h('div'), out = h('div'), actions = h('div', { class: 'actions' });
  let hints = 0, graded = false;
  const hintBtn = h('button', { class: 'btn ghost', type: 'button', onclick: () => {
    if (graded) return; hints++;
    hintBox.replaceChildren(h('div', { class: 'hintline' }, words.map(i => o.tokens[i].core[0]).join(' ')));
    hintBtn.textContent = '💡 Hint (' + hints + ' used)';
  } }, '💡 First letters');
  const checkBtn = h('button', { class: 'btn primary', type: 'button', onclick: () => {
    if (graded) return; graded = true;
    const B = ta.value.split(/\s+/).map(norm).filter(Boolean);
    const { hit, len } = lcsMark(A, B);
    const acc = len / Math.max(A.length, B.length, 1);
    const res = { ok: acc >= PASS && hints === 0, acc, correct: len, total: A.length, hints };
    ta.disabled = true; hintBox.replaceChildren();
    const orig = h('p', { class: 'cloze-text' }); let k = 0;
    o.tokens.forEach((t, i) => {
      const w = t.pre + t.core + t.suf;
      if (!hasAl(t.core)) { orig.append(w, ' '); return; }
      orig.append(h('span', { class: hit[k++] ? 'hit' : 'miss' }, w), ' ');
    });
    out.replaceChildren(h('div', { class: 'muted' }, 'Original (green = you recalled it, red = still to learn):'), orig);
    fb.className = 'fb ' + (res.ok ? 'ok' : 'no');
    fb.textContent = gradeMsg(Math.round(acc * 100) + '% word match', res.ok, acc >= 0.995, hints, 'Aim for 90% to move up.');
    actions.replaceChildren(); o.afterGrade(res, actions);
  } }, 'Check');
  actions.append(checkBtn, hintBtn);
  root.append(ta, hintBox, fb, out, actions);
  setTimeout(() => ta.focus(), 30);
  return root;
}

/* ================= SMART STUDY (stage-based, spaced repetition) ================= */
function startSmart(opt) {
  let ids;
  if (opt.only != null) ids = [opt.only];
  else if (opt.ahead) ids = [...IDS].sort((a, b) => state.p[a].due - state.p[b].due).slice(0, 5);
  else ids = IDS.filter(isDue).sort((a, b) => state.p[a].due - state.p[b].due).slice(0, 12);
  if (!ids.length) return home();
  const S = shell('Smart study');
  const before = Object.fromEntries(ids.map(i => [i, stageLabel(state.p[i])]));
  const queue = [...ids], total = ids.length, requeued = new Set(), first = {}; let done = 0;
  function next() {
    if (!queue.length) return finish();
    const i = queue.shift();
    S.setProg(done / total); S.meta.textContent = Math.min(done + 1, total) + ' / ' + total;
    smartTask(i, S, ok => {
      if (!(i in first)) first[i] = ok;
      if (ok || requeued.has(i)) done++; else { requeued.add(i); queue.push(i); }
      next();
    });
  }
  function finish() {
    S.setProg(1); S.meta.textContent = '';
    const passed = ids.filter(i => first[i]).length;
    S.body.replaceChildren(
      h('div', { class: 'card' },
        h('h1', null, passed === total ? 'Nice work 🎉' : 'Good session!'),
        h('p', { class: 'sub' }, passed + ' of ' + total + ' right on the first try.' + (passed < total ? " The rest will come back soon for another look." : '')),
        h('div', { class: 'plist' }, ids.map(i => h('div', { class: 'pcard', style: 'cursor:default' },
          h('span', { class: 'em' }, P[i].e),
          h('div', null, h('div', { class: 'nm' }, h('span', null, '#' + P[i].n), P[i].k),
            h('div', { class: 'muted' }, first[i] ? 'Got it ✓' : 'Coming back soon for another look')),
          h('div', { class: 'rt' }, before[i] === stageLabel(state.p[i]) ? stageLabel(state.p[i]) : before[i] + ' → ' + stageLabel(state.p[i]), h('div', null, dueText(i))))))),
      h('div', { class: 'actions' },
        h('button', { class: 'btn primary', onclick: home }, 'Home'),
        h('button', { class: 'btn', onclick: () => startSmart(opt.only != null ? opt : { ahead: !IDS.some(isDue) }) }, 'Keep going')));
  }
  next();
}
function smartTask(i, S, cb) {
  const p = P[i], s = state.p[i], st = s.stage;
  function stageTask() {
    const badge = h('div', { class: 'badge st' + st }, 'Stage ' + (st + 1) + ' of 4 · ' + STAGE_NAMES[st]);
    const mk = (text, prompt, frac, mode) => {
      const tokens = tokenize(text), hidden = frac === 1 ? new Set(eligible(tokens)) : pickHidden(tokens, frac, mode);
      S.body.replaceChildren(badge, pChip(i, st === 0), h('div', { class: 'prompt' }, prompt),
        cloze({ tokens, hidden, afterGrade: afterGrade }));
    };
    const afterGrade = (res, actions) => {
      record(i, res.ok, st);
      if (!res.ok) actions.append(h('div', { style: 'flex:1 1 100%' }, h('p', { class: 'muted', style: 'margin:0 0 8px' }, "Here's a quick refresher:"), teach(i)));
      actions.append(h('button', { class: 'btn primary', onclick: () => cb(res.ok) }, 'Continue →'));
    };
    if (st === 0) mk(p.k, 'Recall the keyword for this principle.', 1);
    else if (st === 1) mk(p.s, 'Complete the summary.', 0.4, 'content');
    else if (st === 2) mk(p.t, 'Fill in the missing words.', 0.5, 'random');
    else if (s.streak < 2) mk(p.t, 'Full text: most words are missing.', 0.8, 'random');
    else {
      const tokens = tokenize(p.t);
      S.body.replaceChildren(badge, pChip(i), h('div', { class: 'prompt' }, 'Write the whole principle from memory.'),
        recall({ tokens, afterGrade: afterGrade }));
    }
  }
  if (!s.seen) {
    S.body.replaceChildren(h('div', { class: 'badge st0' }, 'New principle: read it first'), teach(i),
      h('div', { class: 'actions' }, h('button', { class: 'btn primary', onclick: stageTask }, 'Quiz me →')));
  } else stageTask();
}

/* ================= FLASHCARDS ================= */
function flashcards() {
  const S = shell('Flashcards');
  let dir = 'fwd', shuf = true, deck = [], idx = 0, flipped = false, known = 0, learning = [];
  function start(ids) { deck = shuf ? shuffle(ids) : [...ids]; idx = 0; flipped = false; known = 0; learning = []; draw(); }
  function mark(ok) {
    const i = deck[idx]; record(i, ok, 0);
    if (ok) known++; else learning.push(i);
    idx++; flipped = false; draw();
  }
  function draw() {
    S.setProg(idx / deck.length); S.meta.textContent = Math.min(idx + 1, deck.length) + ' / ' + deck.length;
    S.body.replaceChildren();
    const opts = h('div', { class: 'row gap', style: 'margin-bottom:14px' },
      seg([['fwd', 'Number → text'], ['rev', 'Summary → principle']], dir, v => { dir = v; start(IDS); }),
      seg([[true, 'Shuffled'], [false, 'In order']], shuf, v => { shuf = v; start(IDS); }));
    if (idx >= deck.length) {
      S.meta.textContent = '';
      S.body.append(opts, h('div', { class: 'card' }, h('h1', null, 'Round complete'),
        h('p', { class: 'sub' }, known + ' known · ' + learning.length + ' still learning'),
        h('div', { class: 'actions' },
          learning.length ? h('button', { class: 'btn primary', onclick: () => start(learning) }, 'Review still-learning (' + learning.length + ')') : null,
          h('button', { class: 'btn', onclick: () => start(IDS) }, 'Restart all'),
          h('button', { class: 'btn ghost', onclick: home }, 'Home'))));
      return;
    }
    const p = P[deck[idx]];
    const front = dir === 'fwd'
      ? [h('div', { class: 'em' }, p.e), h('div', { class: 'k' }, 'Principle #' + p.n), h('div', { class: 'tap' }, 'Tap to flip')]
      : [h('div', { class: 'n' }, 'Which principle is this?'), h('div', { class: 's', style: 'font-size:1.2rem;margin-top:14px' }, p.s), h('div', { class: 'tap' }, 'Tap to flip')];
    const back = dir === 'fwd'
      ? [h('div', { class: 'k' }, p.k), h('div', { class: 'eyebrow' }, 'Summary'), h('div', { class: 's', style: 'margin-top:0' }, p.s), h('div', { class: 'eyebrow', style: 'text-align:left' }, 'Full text'), h('div', { class: 'f', style: 'margin-top:0' }, p.t)]
      : [h('div', { class: 'em' }, p.e), h('div', { class: 'n' }, 'Principle #' + p.n), h('div', { class: 'k' }, p.k), h('div', { class: 'eyebrow', style: 'text-align:left' }, 'Full text'), h('div', { class: 'f', style: 'margin-top:0' }, p.t)];
    S.body.append(opts,
      h('button', { class: 'fcard' + (flipped ? ' flipped' : ''), onclick: () => { flipped = !flipped; draw(); } }, flipped ? back : front),
      flipped ? h('div', { class: 'actions', style: 'justify-content:center' },
        h('button', { class: 'btn bad', onclick: () => mark(false) }, '↺ Still learning'),
        h('button', { class: 'btn good', onclick: () => mark(true) }, '✓ Known')) : null);
  }
  start(IDS);
}

/* ================= PROGRESSIVE REMOVAL ================= */
function progSetup() {
  const S = shell('Progressive removal');
  let which = 0;
  const sel = h('select', { onchange: e => { which = +e.target.value; } }, IDS.map(i => h('option', { value: i }, '#' + P[i].n + ' ' + P[i].k)));
  S.body.append(h('div', { class: 'card' },
    h('div', { class: 'field' }, h('label', null, 'Principle'), sel),
    h('p', { class: 'muted' }, 'Five rounds: 20%, 40%, 60%, 80%, then 100% of the words hidden. Each round hides more of the same random set. Reach 90% to move up a round. Hints are fine, but you will try that round again without them.'),
    h('div', { class: 'actions' }, h('button', { class: 'btn primary', onclick: () => run(which) }, 'Start'))));
  function run(i) {
    const p = P[i], tokens = tokenize(p.t), order = shuffle(eligible(tokens)), levels = [0.2, 0.4, 0.6, 0.8, 1];
    let r = 0;
    function round() {
      const frac = levels[r];
      S.setProg(r / levels.length); S.meta.textContent = 'Round ' + (r + 1) + ' / ' + levels.length;
      const head = [pChip(i), h('div', { class: 'prompt' }, Math.round(frac * 100) + '% of the words are hidden.')];
      const after = (res, actions) => {
        record(i, res.ok, frac >= 0.8 ? 3 : 2);
        if (res.ok && r === levels.length - 1) {
          S.setProg(1);
          actions.append(h('div', { class: 'fb ok', style: 'flex:1 1 100%' }, 'All words removed and you still recited it. 🎉'),
            h('button', { class: 'btn primary', onclick: progSetup }, 'Another principle'), h('button', { class: 'btn', onclick: home }, 'Home'));
        } else if (res.ok) actions.append(h('button', { class: 'btn primary', onclick: () => { r++; round(); } }, 'Next round →'));
        else actions.append(h('button', { class: 'btn primary', onclick: round }, 'Try this round again'),
          h('button', { class: 'btn', onclick: () => { r = Math.max(0, r - 1); round(); } }, 'Go back a round'));
      };
      if (frac === 1) S.body.replaceChildren(...head, recall({ tokens, afterGrade: after }));
      else {
        const n = Math.max(1, Math.round(order.length * frac));
        S.body.replaceChildren(...head, cloze({ tokens, hidden: new Set(order.slice(0, n)), afterGrade: after }));
      }
    }
    round();
  }
}

  S.body.append(h('div', { class: 'card' }, h('p', { class: 'prompt' }, 'Choose a matching round'),
    h('p', { class: 'muted' }, 'Drag each chip onto its slot. On a touch screen, tap a chip, then tap a slot.'),
    h('div', { class: 'actions' }, Object.entries(TYPES).map(([k, t]) => h('button', { class: 'btn primary', onclick: () => play(k) }, t.name)))));
  function play(k) {
    const T = TYPES[k], placed = new Set(), missed = new Set(); let selected = null, tries = 0;
    const slotsEl = h('div', { class: 'mgrid' }), poolEl = h('div', { class: 'pool' }), info = h('div', { class: 'muted' });
    const attempt = (c, s, dropEl) => {
      tries++;
      if (c === s) { placed.add(s); selected = null; draw(); if (placed.size === P.length) finish(); }
      else { missed.add(c); missed.add(s); selected = null; draw(); const el = slotsEl.querySelector('[data-s="' + s + '"]'); if (el) { el.classList.add('shake'); setTimeout(() => el.classList.remove('shake'), 400); } }
    };
    function draw() {
      const extra = tries - placed.size;
      info.textContent = placed.size + ' / ' + P.length + ' matched' + (extra ? ' · ' + extra + ' extra ' + (extra === 1 ? 'try' : 'tries') : '');
      slotsEl.replaceChildren(...IDS.map(i => {
        const filled = placed.has(i);
        const drop = h('div', { class: 'drop' + (filled ? ' filled' : ''), 'data-s': i }, filled ? T.chip(i) : '');
        if (!filled) {
          drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
          drop.addEventListener('dragleave', () => drop.classList.remove('over'));
          drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); const c = +e.dataTransfer.getData('text/plain'); if (!isNaN(c)) attempt(c, i); });
          drop.addEventListener('click', () => { if (selected != null) attempt(selected, i); });
        }
        return h('div', { class: 'slot' }, h('div', { class: 'lab' }, T.slot(i)), drop);
      }));
      poolEl.replaceChildren(...order.filter(c => !placed.has(c)).map(c => {
        const chip = h('div', { class: 'chip' + (T.long ? ' long' : '') + (selected === c ? ' sel' : ''), draggable: 'true' }, T.chip(c));
        chip.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', String(c)); });
        chip.addEventListener('click', () => { selected = selected === c ? null : c; draw(); });
        return chip;
      }));
    }
    const order = shuffle(IDS);
    S.body.replaceChildren(h('div', { class: 'prompt' }, T.name), info, slotsEl, poolEl);
    S.meta.textContent = '';
    draw();
    function finish() {
      IDS.forEach(i => record(i, !missed.has(i), T.level));
      S.body.replaceChildren(h('div', { class: 'card' }, h('h1', null, missed.size ? 'All matched!' : 'Perfect match 🎉'),
        h('p', { class: 'sub' }, missed.size ? 'Worth another look: ' + [...missed].sort((a, b) => a - b).map(i => '#' + P[i].n).join(', ') : 'Every one on the first try.'),
        h('div', { class: 'actions' }, h('button', { class: 'btn primary', onclick: () => play(k) }, 'Play again'),
          h('button', { class: 'btn', onclick: matching }, 'Other rounds'), h('button', { class: 'btn ghost', onclick: home }, 'Home'))));
    }
  }
}

/* ================= QUIZ ================= */
function quiz() {
  const S = shell('Quiz & scenarios'), N = 10;
  const ids = shuffle([...shuffle(IDS), pick(IDS)]).slice(0, N);
  let q = 0, score = 0; const wrongIds = [];
  function ask() {
    if (q >= N) return end();
    S.setProg(q / N); S.meta.textContent = (q + 1) + ' / ' + N;
    const i = ids[q], p = P[i], r = Math.random();
    const type = r < .4 ? 'sc' : r < .6 ? 'sum' : r < .75 ? 'frag' : r < .9 ? 'nk' : 'kn';
    const others = shuffle(IDS.filter(j => j !== i)).slice(0, 3);
    let prompt, options, level, labelFn = lab;
    if (type === 'sc') { prompt = [h('div', { class: 'prompt' }, 'Which principle does this scenario best illustrate?'), h('p', { class: 'scn' }, pick(p.sc))]; level = 1; }
    else if (type === 'sum') { prompt = [h('div', { class: 'prompt' }, 'Which principle says this?'), h('p', { class: 'scn' }, '“' + p.s + '”')]; level = 1; }
    else if (type === 'frag') { prompt = [h('div', { class: 'prompt' }, 'Which principle begins like this?'), h('p', { class: 'scn' }, '“' + p.t.split(' ').slice(0, 9).join(' ') + '…”')]; level = 2; }
    else if (type === 'nk') { prompt = [h('div', { class: 'prompt' }, 'What is the keyword for Principle #' + p.n + '?')]; labelFn = j => P[j].e + ' ' + P[j].k; level = 0; }
    else { prompt = [h('div', { class: 'prompt' }, 'Which principle number is “' + p.k + '”?')]; labelFn = j => 'Principle #' + P[j].n; level = 0; }
    options = [i, ...others].map(j => ({ label: labelFn(j), correct: j === i }));
    S.body.replaceChildren(choice({ prompt: h('div', null, prompt), options,
      explain: h('div', { class: 'card', style: 'margin-top:12px' }, h('b', null, lab(i)), h('div', { class: 'muted' }, p.s)),
      onNext: ok => { record(i, ok, level); if (ok) score++; else wrongIds.push(i); q++; ask(); } }));
  }
  function end() {
    S.setProg(1); S.meta.textContent = '';
    const miss = [...new Set(wrongIds)];
    S.body.replaceChildren(h('div', { class: 'card' }, h('h1', null, score + ' / ' + N),
      h('p', { class: 'sub' }, miss.length ? 'Worth another look: ' + miss.map(lab).join(' · ') : 'Perfect score 🎉'),
      h('div', { class: 'actions' }, h('button', { class: 'btn primary', onclick: quiz }, 'New quiz'), h('button', { class: 'btn', onclick: home }, 'Home'))));
  }
  ask();
}

home();
</script>
